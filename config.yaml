corpus_dir: minibatch
artifacts_dir: artifacts

shot:
  pyscenedetect_threshold: 27.0
  pyscenedetect_burst_merge_sec: 1.5
  min_shot_sec: 0.5

keyframe:
  short_side: 448
  jpeg_quality: 90
  long_shot_sec: 10.0
  every_sec: 5.0
  max_per_shot: 5
  filter:
    min_sharpness: 120.0
    min_std: 8.0
    min_brightness: 20.0
    max_brightness: 235.0
    duplicate_distance: 5
  follow:
    step_sec: 0.5
    max_frames: 8
    window_sec: 1.0

embed:
  model: sentence-transformers/clip-ViT-B-16
  dim: 512
  batch_size: 128
  fp16: true

ocr:
  engine: null
  language: vi
  min_conf: 0.5

asr:
  model: large-v3
  compute_type: float16
  language: vi

objects:
  model: yolov8x.pt
  conf: 0.25

faiss:
  type: flat
  hnsw_m: 32
  ef_search: 64

search:
  dense_k: 200
  top_k: 20
  rrf_k: 60
  temporal_window: 1
  weights:
    dense: 1.0
    ocr: 0.5
    asr: 0.7
    obj: 0.4
  boost:
    object: 1.2
    text_exact: 1.3

translate:
  enabled: true
  model: VietAI/envit5-translation

api:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
