corpus_dir: Dataset
artifacts_dir: artifacts
state_dir: state

shot:
  pyscenedetect_threshold: 27.0
  pyscenedetect_burst_merge_sec: 0.0
  min_shot_sec: 0.5

ingest:
  workers: 6
  decode_threads: 2

keyframe:
  short_side: 448
  jpeg_quality: 90
  every_sec: 4.0
  candidate_step_sec: 0.25
  min_gap_sec: 1.0
  filter:
    min_std: 8.0
    min_brightness: 20.0
    max_brightness: 235.0
    duplicate_distance: 5
    metric_width: 320
  follow:
    step_sec: 0.5
    max_frames: 8
    window_sec: 1.0
    short_side: 320
    quality: 75
    image_format: webp
    bidirectional: true

embed:
  model: sentence-transformers/clip-ViT-B-16
  dim: 512
  batch_size: 128
  fp16: true

ocr:
  engine: null
  language: vi
  min_conf: 0.5

asr:
  model: large-v3
  compute_type: float16
  language: vi

objects:
  model: yolov8x.pt
  conf: 0.25

faiss:
  type: flat
  hnsw_m: 32
  ef_search: 64

search:
  dense_k: 200
  top_k: 20
  rrf_k: 60
  temporal_window: 1
  weights:
    dense: 1.0
    ocr: 0.5
    asr: 0.7
    obj: 0.4
  boost:
    object: 1.2
    text_exact: 1.3

translate:
  enabled: true
  model: VietAI/envit5-translation

dres:
  base_url: https://aiclub.uit.edu.vn/dres
  session_id: null
  evaluation_id: null
  timeout_sec: 15.0

api:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
